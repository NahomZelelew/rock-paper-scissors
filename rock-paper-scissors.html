<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-Paper-Scissors</title>
  <link rel="stylesheet" href="css/rock-paper-scissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="btns"><img class="icon" src="images/rock-emoji.png" alt="Rock"></button>
  <button class="btns"><img class="icon" src="images/paper-emoji.png" alt="Paper"></button>
  <button class="btns"><img class="icon" src="images/scissors-emoji.png" alt="Scissors"></button>
  <button class="reset-btn">Reset Score</button>
  <button class="auto-play">Auto Play</button>

  <script src="js/rock-paper-scissors.js"></script>
</body>
</html>
